<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Plat Nomor — Kasir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root { --plate:#121314; --white:#F7F7F2; --ground:#E7E6E1; --yellow:#F4C21B; --red:#C8261E; --ink:#121314; --muted:#4A4B48; --rule:#CFCDC6; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:390px; height:844px; overflow:hidden; }
  body { font-family:Barlow, system-ui, sans-serif; background:var(--ground); color:var(--ink); display:flex; flex-direction:column; }
  .num { font-family:"Barlow Condensed", sans-serif; font-variant-numeric:tabular-nums; }
  .band { background:var(--plate); color:var(--white); padding:54px 16px 16px; display:flex; flex-direction:column; gap:12px; }
  .band h1 { font-size:24px; font-weight:700; letter-spacing:.01em; }
  .search { height:48px; border-radius:8px; background:var(--white); display:flex; align-items:center; gap:8px; padding:0 12px; color:var(--muted); font-size:16px; }
  .seg { display:flex; gap:8px; }
  .seg span { height:36px; padding:0 14px; border-radius:8px; border:1.5px solid var(--white); display:flex; align-items:center; font-size:14px; font-weight:600; }
  .seg span.on { background:var(--white); color:var(--plate); }
  .list { flex:1; padding:12px 16px; display:flex; flex-direction:column; gap:0; }
  .row { background:var(--white); display:grid; grid-template-columns:1fr auto 48px; align-items:center; gap:12px; padding:12px 12px 12px 16px; border-bottom:1px solid var(--rule); }
  .row:first-child { border-radius:12px 12px 0 0; } .row:last-child { border-radius:0 0 12px 12px; border-bottom:0; }
  .name { font-size:16px; font-weight:600; }
  .tag { margin-top:4px; display:inline-flex; font-size:12px; font-weight:700; padding:1px 6px; border:1.5px solid var(--ink); border-radius:4px; }
  .tag.low { border-color:var(--red); color:var(--red); }
  .price { font-size:20px; font-weight:700; text-align:right; min-width:92px; }
  .add { width:48px; height:48px; border-radius:8px; background:var(--plate); color:var(--white); display:flex; align-items:center; justify-content:center; font-size:26px; font-weight:600; }
  .step { display:flex; align-items:center; gap:6px; font-weight:700; }
  .step b { width:40px; height:40px; border-radius:8px; border:1.5px solid var(--ink); display:flex; align-items:center; justify-content:center; font-size:22px; }
  .dock { padding:12px 16px 104px; }
  .platebar { display:flex; border-radius:12px; overflow:hidden; background:var(--plate); height:76px; }
  .plate { flex:1; margin:6px; border:2px solid var(--white); border-radius:8px; display:flex; flex-direction:column; justify-content:center; padding:0 14px; color:var(--white); }
  .plate .total { font-size:32px; font-weight:700; line-height:1; letter-spacing:.02em; }
  .plate .meta { font-size:12px; font-weight:600; letter-spacing:.08em; margin-top:2px; }
  .pay { width:112px; background:var(--yellow); color:var(--plate); display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:700; }
  .tabs { position:absolute; left:16px; right:16px; bottom:24px; height:64px; border-radius:32px; background:var(--white); display:flex; justify-content:space-around; align-items:center; font-size:12px; font-weight:600; box-shadow:0 6px 18px rgba(18,19,20,.18); }
  .tabs span.on { background:var(--plate); color:var(--white); padding:10px 16px; border-radius:22px; }
</style>
</head>
<body>
  <header class="band">
    <h1>Kasir</h1>
    <div class="search">⌕ Cari sparepart, SKU, atau jasa</div>
    <div class="seg"><span class="on">Semua</span><span>Sparepart 3</span><span>Jasa 2</span></div>
  </header>
  <main class="list">
    <div class="row"><div><div class="name">Busi NGK CPR6EA-9</div><span class="tag num">STOK 10 PCS</span></div><div class="price num">Rp28.000</div><div class="step"><b>−</b></div></div>
    <div class="row"><div><div class="name">Kampas Rem Depan</div><span class="tag low num">MENIPIS · 2 SET</span></div><div class="price num">Rp85.000</div><div class="add">+</div></div>
    <div class="row"><div><div class="name">Oli MPX2 10W-30</div><span class="tag num">STOK 23 BOTOL</span></div><div class="price num">Rp95.000</div><div class="add">+</div></div>
    <div class="row"><div><div class="name">Servis Ringan</div><span class="tag num">JASA</span></div><div class="price num">Rp75.000</div><div class="add">+</div></div>
    <div class="row"><div><div class="name">Ganti Oli</div><span class="tag num">JASA</span></div><div class="price num">Rp20.000</div><div class="add">+</div></div>
  </main>
  <div class="dock">
    <div class="platebar">
      <div class="plate"><div class="total num">Rp28.000</div><div class="meta num">1 ITEM · TUNAI</div></div>
      <div class="pay">Bayar ›</div>
    </div>
  </div>
  <nav class="tabs"><span>Home</span><span class="on">Kasir</span><span>Stok</span><span>Lainnya</span></nav>
</body>
</html>
