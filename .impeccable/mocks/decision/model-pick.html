<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Nota Kontan — Kasir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --paper:#F6EFE6; --carbon:#23408E; --serial:#C0392B; --ink:#1C1B19; --line:#E2D2C1; --muted:#5B5650; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:390px; height:844px; overflow:hidden; }
  body { font-family:"Work Sans", system-ui, sans-serif; background:var(--paper); color:var(--ink); display:flex; flex-direction:column; }
  .num { font-variant-numeric:tabular-nums; }
  header { padding:56px 16px 12px; display:flex; justify-content:space-between; align-items:flex-end; }
  header h1 { font-size:24px; font-weight:700; color:var(--carbon); }
  .serial { font-size:14px; font-weight:700; color:var(--serial); letter-spacing:.06em; }
  .search { margin:0 16px 8px; height:48px; border:1.5px solid var(--carbon); border-radius:8px; background:#FFFDF9; display:flex; align-items:center; padding:0 12px; color:var(--muted); font-size:16px; }
  .sheet { flex:1; margin:8px 16px 0; background:#FFFDF9; border-radius:12px 12px 0 0; padding:8px 16px; }
  .head { display:grid; grid-template-columns:1fr 96px 48px; font-size:12px; font-weight:700; color:var(--carbon); padding:8px 0; border-bottom:2px solid var(--carbon); letter-spacing:.06em; }
  .row { display:grid; grid-template-columns:1fr 96px 48px; align-items:center; min-height:60px; border-bottom:1px solid var(--line); }
  .name { font-size:16px; font-weight:600; color:var(--carbon); }
  .sub { font-size:12px; color:var(--muted); margin-top:2px; }
  .price { text-align:right; font-size:16px; font-weight:700; color:var(--carbon); }
  .add { justify-self:end; width:40px; height:40px; border-radius:20px; border:1.5px solid var(--carbon); color:var(--carbon); display:flex; align-items:center; justify-content:center; font-size:22px; }
  .add.in { background:var(--carbon); color:#FFFDF9; font-size:16px; font-weight:700; }
  .jumlah { margin:0 16px; background:#FFFDF9; padding:12px 16px 16px; border-radius:0 0 12px 12px; }
  .box { border:2px solid var(--carbon); border-radius:8px; display:flex; align-items:center; justify-content:space-between; padding:10px 12px; }
  .box span { font-size:14px; font-weight:700; color:var(--carbon); }
  .box strong { font-size:28px; font-weight:700; color:var(--carbon); }
  .pay { margin-top:10px; height:52px; border-radius:8px; background:var(--carbon); color:#FFFDF9; display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:700; }
  .tabs { margin:12px 16px 24px; height:60px; border-radius:30px; background:#FFFDF9; border:1px solid var(--line); display:flex; justify-content:space-around; align-items:center; font-size:12px; font-weight:600; color:var(--muted); }
  .tabs .on { color:var(--carbon); font-weight:700; }
</style>
</head>
<body>
  <header><h1>Nota Baru</h1><div class="serial num">No. 000214</div></header>
  <div class="search">Cari sparepart, SKU, atau jasa</div>
  <section class="sheet">
    <div class="head"><span>BARANG / JASA</span><span style="text-align:right">HARGA</span><span></span></div>
    <div class="row"><div><div class="name">Busi NGK CPR6EA-9</div><div class="sub">Stok 10 pcs</div></div><div class="price num">28.000</div><div class="add in">1</div></div>
    <div class="row"><div><div class="name">Kampas Rem Depan</div><div class="sub" style="color:var(--serial)">Menipis · 2 set</div></div><div class="price num">85.000</div><div class="add">+</div></div>
    <div class="row"><div><div class="name">Oli MPX2 10W-30</div><div class="sub">Stok 23 botol</div></div><div class="price num">95.000</div><div class="add">+</div></div>
    <div class="row"><div><div class="name">Servis Ringan</div><div class="sub">Jasa</div></div><div class="price num">75.000</div><div class="add">+</div></div>
  </section>
  <section class="jumlah">
    <div class="box"><span>JUMLAH Rp</span><strong class="num">28.000</strong></div>
    <div class="pay">Bayar</div>
  </section>
  <nav class="tabs"><span>Home</span><span class="on">Kasir</span><span>Stok</span><span>Lainnya</span></nav>
</body>
</html>
