<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Standar kategori — Kasir</title>
<style>
  :root { --bg:#F3F5F9; --card:#FFFFFF; --ink:#1F2937; --muted:#6B7280; --blue:#2563EB; --line:#E5E7EB; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:390px; height:844px; overflow:hidden; }
  body { font-family:system-ui, -apple-system, Roboto, sans-serif; background:var(--bg); color:var(--ink); display:flex; flex-direction:column; }
  header { padding:56px 16px 12px; background:var(--card); border-bottom:1px solid var(--line); }
  header h1 { font-size:20px; font-weight:700; margin-bottom:12px; }
  .search { height:44px; border-radius:22px; background:var(--bg); display:flex; align-items:center; padding:0 16px; color:var(--muted); font-size:15px; }
  .chips { display:flex; gap:8px; padding:12px 16px; }
  .chips span { padding:6px 14px; border-radius:16px; background:var(--card); border:1px solid var(--line); font-size:14px; }
  .chips .on { background:var(--blue); color:#fff; border-color:var(--blue); }
  .grid { flex:1; display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:0 16px; align-content:start; }
  .tile { background:var(--card); border-radius:12px; padding:12px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  .img { height:72px; border-radius:8px; background:#E8EEF9; margin-bottom:8px; }
  .t { font-size:14px; font-weight:600; }
  .p { font-size:15px; font-weight:700; color:var(--blue); margin-top:4px; }
  .s { font-size:12px; color:var(--muted); }
  .cart { margin:12px 16px 100px; height:56px; border-radius:12px; background:var(--blue); color:#fff; display:flex; align-items:center; justify-content:space-between; padding:0 16px; font-weight:700; }
  .tabs { position:absolute; left:0; right:0; bottom:0; height:80px; background:var(--card); border-top:1px solid var(--line); display:flex; justify-content:space-around; padding-top:12px; font-size:12px; color:var(--muted); }
  .tabs .on { color:var(--blue); font-weight:700; }
</style>
</head>
<body>
  <header><h1>Kasir</h1><div class="search">Cari produk</div></header>
  <div class="chips"><span class="on">Semua</span><span>Sparepart</span><span>Jasa</span></div>
  <main class="grid">
    <div class="tile"><div class="img"></div><div class="t">Busi NGK CPR6EA-9</div><div class="p">Rp28.000</div><div class="s">Stok 10</div></div>
    <div class="tile"><div class="img"></div><div class="t">Kampas Rem Depan</div><div class="p">Rp85.000</div><div class="s">Stok 2</div></div>
    <div class="tile"><div class="img"></div><div class="t">Oli MPX2 10W-30</div><div class="p">Rp95.000</div><div class="s">Stok 23</div></div>
    <div class="tile"><div class="img"></div><div class="t">Servis Ringan</div><div class="p">Rp75.000</div><div class="s">Jasa</div></div>
  </main>
  <div class="cart"><span>1 item</span><span>Rp28.000 ›</span></div>
  <nav class="tabs"><span>Home</span><span class="on">Kasir</span><span>Stok</span><span>Lainnya</span></nav>
</body>
</html>
